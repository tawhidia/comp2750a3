<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Marketplace – Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<!--
  login.html – Page 1: Sign-In Page
  - Accepts email + password and authenticates via Firebase Auth
  - Redirects to index.html on success
  - If already signed in, skips straight to index.html
-->

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="card shadow p-4" style="width: 100%; max-width: 420px;">

    <!-- Header -->
    <div class="text-center mb-4">
      <h2 class="fw-bold mb-0">The Campus Marketplace</h2>
      <p class="text-muted">Macquarie University</p>
    </div>

    <!-- Error alert (hidden by default) -->
    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

    <!-- Email field -->
    <div class="mb-3">
      <label for="email" class="form-label">Full Student Email</label>
      <input type="email" class="form-control" id="email" placeholder="YourEmail@mq.edu.au" autocomplete="email" />
    </div>

    <!-- Password field -->
    <div class="mb-4">
      <input type="password" class="form-control" id="password" placeholder="Enter Your Password Here" autocomplete="current-password" />
    </div>

    <!-- Sign-in button -->
    <button id="signInBtn" class="btn btn-primary w-100">Sign In</button>

  </div>

  <!-- ── Firebase SDKs (compat v10) ── -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    // ── Auth state observer ──────────────────────────────────
    // If the user is already signed in (e.g. refreshed the page),
    // skip the login screen and go straight to the welcome page.
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'index.html';
    });

    // ── Sign-in handler ──────────────────────────────────────
    document.getElementById('signInBtn').addEventListener('click', () => {
      const email     = document.getElementById('email').value.trim();
      const password  = document.getElementById('password').value;
      const errorEl   = document.getElementById('errorAlert');

      // Reset any previous error
      errorEl.classList.add('d-none');
      errorEl.textContent = '';

      // Basic client-side validation
      if (!email || !password) {
        errorEl.textContent = 'Please enter both your email and password.';
        errorEl.classList.remove('d-none');
        return;
      }

      // Disable button to prevent duplicate clicks
      const btn = document.getElementById('signInBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      // Firebase Authentication
      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          // onAuthStateChanged will fire and redirect automatically,
          // but we also redirect here as a fallback.
          window.location.href = 'index.html';
        })
        .catch(() => {
          errorEl.textContent = 'Invalid email or password. Please try again.';
          errorEl.classList.remove('d-none');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        });
    });

    // Allow pressing Enter in the password field to trigger sign-in
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('signInBtn').click();
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
