<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Marketplace – My Listings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<!--
  mylistings.html – Page 4: My Listings
  - Auth-guarded
  - Queries Firestore for items where sellerId == currentUser.uid
  - Displays the user's own listings (no shortlist button)
  - Shows an empty state message if the user has no listings
-->

<body class="bg-light">

  <!-- ── Navbar ─────────────────────────────────────────── -->
  <nav class="navbar navbar-dark" style="background-color: #A6192E;">
    <a class="navbar-brand fw-bold text-white text-decoration-none" href="index.html">
      Campus Marketplace
    </a>
    <div>
      <a href="index.html" class="btn btn-outline-light btn-sm me-2">Home</a>
      <button id="signOutBtn" class="btn btn-outline-light btn-sm" style ="background-color: #373A36;">Sign Out</button>
    </div>
  </nav>

  <!-- ── Main content ───────────────────────────────────── -->
  <div class="container mt-4 mb-5">

    <h2 class="fw-bold mb-1">My Listings</h2>
    <p class="text-muted mb-4">View and manage your marketplace listings</p>

    <!-- Loading spinner -->
    <div id="loadingSpinner" class="text-center my-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading…</span>
      </div>
      <p class="mt-2 text-muted">Loading your listings…</p>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="text-center my-5 d-none">
      <p class="text-muted fs-5">You haven't listed any items yet.</p>
    </div>

    <!-- Item cards grid -->
    <div id="itemsGrid" class="row g-4 d-none"></div>

  </div>

  <!-- ── Firebase SDKs ──────────────────────────────────── -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    // ── Auth guard ───────────────────────────────────────────
    auth.onAuthStateChanged(async user => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      await loadMyListings(user);
    });

    // ── Sign out ─────────────────────────────────────────────
    document.getElementById('signOutBtn').addEventListener('click', () => {
      auth.signOut().then(() => window.location.href = 'login.html');
    });

    // ── Load current user's listings ─────────────────────────
    async function loadMyListings(user) {
      try {
        // Query only items belonging to this user using their UID
        const snap = await db
          .collection('items')
          .where('sellerId', '==', user.uid)
          .get();

        // Hide spinnerloadMyListings regardless of result
        document.getElementById('loadingSpinner').classList.add('d-none');

        if (snap.empty) {
          document.getElementById('emptyState').classList.remove('d-none');
          return;
        }

        // Render listings
        const grid = document.getElementById('itemsGrid');
        grid.classList.remove('d-none');

        snap.forEach(doc => renderListingCard(doc.data(), grid));

      } catch (err) {
        console.error('Error loading listings:', err);
        document.getElementById('loadingSpinner').classList.add('d-none');
        const emptyEl = document.getElementById('emptyState');
        emptyEl.textContent = 'Error loading your listings. Please refresh.';
        emptyEl.classList.remove('d-none');
      }
    }

    // ── Render a single listing card ─────────────────────────
    function renderListingCard(item, grid) {
      // Price display: "Trade" badge or dollar amount
      const priceHTML = item.isForTrade
        ? '<span class="badge bg-warning text-dark fs-6">Trade</span>'
        : `<span class="fw-bold text-success fs-6">$${item.price}</span>`;

      const col = document.createElement('div');
      col.className = 'col-sm-6 col-lg-4';
      col.innerHTML = `
        <div class="card h-100 shadow-sm border-0">

          <!-- Item image -->
          <img
            src="${item.imageUrl}"
            class="card-img-top"
            alt="${item.name}"
            style="height: 200px; object-fit: cover;"
            onerror="this.src='https://picsum.photos/seed/fallback/400/300'"
          />

          <div class="card-body d-flex flex-column">

            <!-- Name + category -->
            <div class="d-flex justify-content-between align-items-start mb-2">
              <h5 class="card-title mb-0">${item.name}</h5>
              <span class="badge bg-secondary ms-2">${item.category}</span>
            </div>

            <!-- Description -->
            <p class="card-text text-muted small flex-grow-1">${item.description}</p>

            <!-- Price (no shortlist button — this is your own listing) -->
            <div class="mt-2">
              ${priceHTML}
            </div>

            <!-- "Your listing" label -->
            <div class="mt-3">
              <span class="badge bg-light text-dark border">Your listing</span>
            </div>

          </div>
        </div>
      `;

      grid.appendChild(col);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
