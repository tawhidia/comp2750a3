<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Marketplace – Browse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<!--
  marketplace.html – Page 3: Marketplace
  - Auth-guarded
  - Loads ALL items from Firestore, then filters out the signed-in
    user's own listings so they only see other students' items
  - Loads the user's existing shortlist so already-shortlisted items
    show a disabled "Shortlisted ✓" button (green)
  - "Shortlist" button writes to shortlists/{uid}/items/{itemId}
-->

<body class="bg-light">

  <!-- ── Navbar ─────────────────────────────────────────── -->
  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold text-white text-decoration-none" href="index.html">
      🎓 Campus Marketplace
    </a>
    <div>
      <a href="index.html" class="btn btn-outline-light btn-sm me-2">← Home</a>
      <button id="signOutBtn" class="btn btn-outline-light btn-sm">Sign Out</button>
    </div>
  </nav>

  <!-- ── Main content ───────────────────────────────────── -->
  <div class="container mt-4 mb-5">

    <h2 class="fw-bold mb-1">Browse Marketplace</h2>
    <p class="text-muted mb-4">Items listed by other Macquarie students</p>

    <!-- Loading spinner -->
    <div id="loadingSpinner" class="text-center my-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading…</span>
      </div>
      <p class="mt-2 text-muted">Loading items…</p>
    </div>

    <!-- Empty state (shown if no items exist after filtering) -->
    <div id="emptyState" class="text-center my-5 d-none">
      <p class="text-muted fs-5">No items available right now. Check back later!</p>
    </div>

    <!-- Item cards — 3-column responsive grid -->
    <div id="itemsGrid" class="row g-4 d-none"></div>

  </div>

  <!-- ── Firebase SDKs ──────────────────────────────────── -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    // Track the signed-in user and their shortlist
    let currentUser    = null;
    let shortlistedIds = new Set(); // item IDs the user has already shortlisted

    // ── Auth guard ───────────────────────────────────────────
    auth.onAuthStateChanged(async user => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      await loadMarketplace();
    });

    // ── Sign out ─────────────────────────────────────────────
    document.getElementById('signOutBtn').addEventListener('click', () => {
      auth.signOut().then(() => window.location.href = 'login.html');
    });

    // ── Load marketplace ─────────────────────────────────────
    async function loadMarketplace() {
      try {
        // Step 1: Fetch this user's existing shortlist so we can
        //         pre-mark already-shortlisted items.
        const shortlistSnap = await db
          .collection('shortlists')
          .doc(currentUser.uid)
          .collection('items')
          .get();

        shortlistSnap.forEach(doc => shortlistedIds.add(doc.id));

        // Step 2: Fetch ALL items from the 'items' collection.
        const itemsSnap = await db.collection('items').get();

        // Step 3: Filter out the current user's own listings.
        //         Students should not be able to shortlist their own items.
        const otherItems = itemsSnap.docs.filter(
          doc => doc.data().sellerId !== currentUser.uid
        );

        // Hide spinner
        document.getElementById('loadingSpinner').classList.add('d-none');

        if (otherItems.length === 0) {
          document.getElementById('emptyState').classList.remove('d-none');
          return;
        }

        // Step 4: Render each item as a Bootstrap card
        const grid = document.getElementById('itemsGrid');
        grid.classList.remove('d-none');

        otherItems.forEach(doc => renderItemCard(doc.id, doc.data(), grid));

      } catch (err) {
        console.error('Error loading marketplace:', err);
        document.getElementById('loadingSpinner').classList.add('d-none');
        const emptyEl = document.getElementById('emptyState');
        emptyEl.textContent = 'Error loading items. Please refresh the page.';
        emptyEl.classList.remove('d-none');
      }
    }

    // ── Render a single item card ────────────────────────────
    function renderItemCard(itemId, item, grid) {
      const isShortlisted = shortlistedIds.has(itemId);

      // Price display: show "Trade" badge or dollar amount
      const priceHTML = item.isForTrade
        ? '<span class="badge bg-warning text-dark fs-6">Trade</span>'
        : `<span class="fw-bold text-success fs-6">$${item.price}</span>`;

      // Shortlist button state
      const btnClass    = isShortlisted ? 'btn-success'        : 'btn-outline-primary';
      const btnLabel    = isShortlisted ? '✓ Shortlisted'      : 'Shortlist';
      const btnDisabled = isShortlisted ? 'disabled'           : '';

      // Build card column
      const col = document.createElement('div');
      col.className = 'col-sm-6 col-lg-4';
      col.id = `card-${itemId}`;
      col.innerHTML = `
        <div class="card h-100 shadow-sm border-0">

          <!-- Item image -->
          <img
            src="${item.imageUrl}"
            class="card-img-top"
            alt="${item.name}"
            style="height: 200px; object-fit: cover;"
            onerror="this.src='https://picsum.photos/seed/fallback/400/300'"
          />

          <div class="card-body d-flex flex-column">

            <!-- Name + category -->
            <div class="d-flex justify-content-between align-items-start mb-2">
              <h5 class="card-title mb-0">${item.name}</h5>
              <span class="badge bg-secondary ms-2">${item.category}</span>
            </div>

            <!-- Description -->
            <p class="card-text text-muted small flex-grow-1">${item.description}</p>

            <!-- Price + seller email -->
            <div class="d-flex justify-content-between align-items-center mt-2 mb-3">
              ${priceHTML}
              <small class="text-muted">${item.sellerEmail}</small>
            </div>

            <!-- Shortlist button -->
            <button
              class="btn ${btnClass} w-100"
              id="btn-${itemId}"
              onclick="shortlistItem('${itemId}', \`${item.name}\`)"
              ${btnDisabled}
            >${btnLabel}</button>

          </div>
        </div>
      `;

      grid.appendChild(col);
    }

    // ── Shortlist an item ────────────────────────────────────
    // Writes a document to shortlists/{userId}/items/{itemId}
    // storing the itemId and name so shortlist.html can display it
    // without needing to re-fetch the full items collection.
    async function shortlistItem(itemId, itemName) {
      const btn = document.getElementById(`btn-${itemId}`);

      // Optimistically disable the button while saving
      btn.disabled   = true;
      btn.textContent = 'Saving…';

      try {
        await db
          .collection('shortlists')
          .doc(currentUser.uid)
          .collection('items')
          .doc(itemId)
          .set({
            itemId,
            itemName,
            addedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

        // Update button to confirmed state
        btn.textContent = '✓ Shortlisted';
        btn.className   = 'btn btn-success w-100';
        shortlistedIds.add(itemId);

      } catch (err) {
        console.error('Error shortlisting item:', err);
        // Restore button on failure
        btn.disabled    = false;
        btn.textContent = 'Shortlist';
        btn.className   = 'btn btn-outline-primary w-100';
        alert('Could not save item. Please try again.');
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
